{% extends 'base.html' %}
{% block title %}Get Private Key{% endblock %}

{% block content %}
<h2>🔑 Get Private Key</h2>
<form method="POST">
    <select name="app_id" class="form-select" required>
        <option value="">-- Choose Application --</option>
        {% for app in apps %}
        <option value="{{ app.app_id }}" {% if selected_app and selected_app.app_id == app.app_id %}selected{% endif %}>
            {{ app.app_name }}
        </option>
        {% endfor %}
    </select>
    <button class="btn btn-primary mt-2">Fetch Private Key</button>
</form>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}


{% if private_key %}
<div class="card mt-3">
    <h4>Private Key:</h4>
    <pre>{{ private_key }}</pre>
</div>
{% endif %}
{% endblock %}
